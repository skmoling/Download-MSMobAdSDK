name: Download & Measure MSMobAdSDK

on:
  workflow_dispatch:

jobs:
  # 1. 下载 Pods 并上传 artifact
  download-pod:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 CocoaPods 缓存
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/CocoaPods/
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 安装依赖工具
        run: |
          sudo gem install cocoapods
          brew install xcodegen

      - name: 生成工程 & Podfile & 安装依赖
        run: |
          mkdir -p project
          cd project
          mkdir -p Dummy
          cat > project.yml <<'EOF'
          name: Dummy
          options:
            deploymentTarget:
              iOS: "12.0"
          targets:
            Dummy:
              type: application
              platform: iOS
              sources: [Dummy]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.test.dummy
                IPHONEOS_DEPLOYMENT_TARGET: 12.0
                CODE_SIGN_STYLE: Manual
                CODE_SIGN_IDENTITY: iPhone Developer
                DEVELOPMENT_TEAM: ""
          EOF
          xcodegen generate
          cat > Podfile <<'EOF'
          platform :ios, '12.0'
          target 'Dummy' do
            pod 'MSMobAdSDK/MS','2.7.12.3'
          end
          EOF
          pod install --repo-update

      - name: 打包 Pods + Podfile
        run: |
          cd project
          zip -r ../MSMobAdSDK_Pods.zip Pods Podfile

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MSMobAdSDK-Pods-Folder
          path: MSMobAdSDK_Pods.zip
          retention-days: 30

  # 2. 云端编译 & 量体积（仅 Build，不 Archive）
  measure-size:
    needs: download-pod
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具
        run: |
          sudo gem install cocoapods
          brew install xcodegen

      - name: 下载 Pods 包
        uses: actions/download-artifact@v4
        with:
          name: MSMobAdSDK-Pods-Folder

      - name: 解压 & 生成工程并 pod install
        run: |
          unzip -q MSMobAdSDK_Pods.zip -d project
          cd project
          mkdir -p Dummy
          cat > project.yml <<'EOF'
          name: Dummy
          options:
            deploymentTarget:
              iOS: "12.0"
          targets:
            Dummy:
              type: application
              platform: iOS
              sources: [Dummy]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.test.dummy
                IPHONEOS_DEPLOYMENT_TARGET: 12.0
                CODE_SIGNING_ALLOWED: NO
          EOF
          xcodegen generate
          pod install --repo-update

      - name: Build（仅链接，不 Archive）
        run: |
          cd project
          xcodebuild build \
                     -workspace Dummy.xcworkspace \
                     -scheme Dummy \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: 计算可执行文件体积
        run: |
          cd project
          EXEC=Build/Products/Release-iphoneos/Dummy.app/Dummy
          SIZE=$(stat -f%z "$EXEC")
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "### SDK 链接后可执行文件大小" >> $GITHUB_STEP_SUMMARY
          echo "- **${SIZE_MB} MiB**"          >> $GITHUB_STEP_SUMMARY
