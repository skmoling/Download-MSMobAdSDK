name: Download MSMobAdSDK Pod

on:
  workflow_dispatch:

jobs:
  download-pod:
    runs-on: macos-latest

    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 设置 CocoaPods 缓存
        id: cache-pods
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/CocoaPods/
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 安装 CocoaPods
        run: sudo gem install cocoapods

      - name: 配置国内镜像源
        run: |
          if [ ! -d ~/.cocoapods/repos/master ]; then
            echo "master 仓库不存在，直接添加清华源"
            pod repo add master https://mirrors.tuna.tsinghua.edu.cn/git/CocoaPods/Specs.git
          else
            echo "master 仓库存在，先删除再添加"
            pod repo remove master
            pod repo add master https://mirrors.tuna.tsinghua.edu.cn/git/CocoaPods/Specs.git
          fi
          pod repo update

      - name: 创建项目目录和 Podfile
        run: |
          mkdir -p project
          cd project
          cat > Podfile << EOF
          platform :ios, '12.0'
          target 'Dummy' do
            pod 'MSMobAdSDK/MS','2.7.12.3'
          end
          EOF

      - name: 创建虚拟 Xcode 项目
        run: |
          cd project
          # 创建一个空的 Xcode 项目（只需要 .xcodeproj 文件）
          xcodebuild -create-xcworkspace -silent
          # 或者使用更简单的方法创建一个空的 .xcodeproj
          mkdir -p Dummy.xcodeproj
          touch Dummy.xcodeproj/project.pbxproj

      - name: 安装 Pod 依赖
        run: |
          cd project
          # 指定项目路径
          pod install --project-directory=. --repo-update

      - name: 打包 Pods 目录
        run: |
          cd project
          zip -r ../MSMobAdSDK_Pods.zip Pods

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MSMobAdSDK-Pods-Folder
          path: MSMobAdSDK_Pods.zip
          retention-days: 30
