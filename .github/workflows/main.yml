name: Download & Measure MSMobAdSDK

on:
  workflow_dispatch:

jobs:
  # 1. 下载 Pods 并上传 artifact
  download-pod:
    runs-on: macos-latest
    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 设置 CocoaPods 缓存
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/CocoaPods/
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 安装依赖工具
        run: |
          sudo gem install cocoapods
          brew install xcodegen

      - name: 生成工程 & Podfile & 安装依赖
        run: |
          mkdir -p project
          cd project
          # 1. 工程描述（静态库）
          cat > project.yml <<'EOF'
          name: SDKSize
          options:
            deploymentTarget:
              iOS: "12.0"
          targets:
            SDKSize:
              type: library.static
              platform: iOS
              sources: [Sources]
          EOF
          # 2. 空源文件
          mkdir Sources
          echo 'void dummy(){}' > Sources/dummy.m
          # 3. Podfile
          cat > Podfile <<'EOF'
          platform :ios, '12.0'
          target 'SDKSize' do
            pod 'MSMobAdSDK/MS','2.7.12.3'
          end
          EOF
          # 4. 先 xcodegen 生成 .xcodeproj
          xcodegen generate
          # 5. 再 pod install
          pod install --repo-update

      - name: 打包 Pods + 工程文件 + 源码
        run: |
          cd project
          zip -r ../MSMobAdSDK_Pods.zip Pods Podfile project.yml Sources

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MSMobAdSDK-Pods-Folder
          path: MSMobAdSDK_Pods.zip
          retention-days: 30

  # 2. 云端编译 & 量体积（静态库，无签名、无 plist、无 validate）
  measure-size:
    needs: download-pod
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具
        run: |
          sudo gem install cocoapods
          brew install xcodegen

      - name: 下载 Pods 包
        uses: actions/download-artifact@v4
        with:
          name: MSMobAdSDK-Pods-Folder

      - name: 解压 & 生成工程并 pod install
        run: |
          unzip -q MSMobAdSDK_Pods.zip -d project
          cd project
          xcodegen generate
          pod install --repo-update

      - name: Build（静态库，无签名）
        run: |
          cd project
          xcodebuild build \
                     -workspace SDKSize.xcworkspace \
                     -scheme SDKSize \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO

      - name: 计算静态库体积
        run: |
          cd project
          LIB=Build/Products/Release-iphoneos/libSDKSize.a
          SIZE=$(stat -f%z "$LIB")
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "### SDK 链接后静态库大小" >> $GITHUB_STEP_SUMMARY
          echo "- **${SIZE_MB} MiB**"          >> $GITHUB_STEP_SUMMARY
